<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客户周报满意度回访</title>
    <style>
      :root {
        color-scheme: light;
        --page-background: #f3f4f6;
        --card-background: rgba(255, 255, 255, 0.98);
        --text-primary: #171a1d;
        --text-secondary: #737a84;
        --text-placeholder: #a8afb8;
        --brand: #0b7cff;
        --brand-soft: #edf5ff;
        --border: #e2e6eb;
        --danger: #e74444;
        --shadow: 0 16px 48px rgba(31, 35, 41, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page-background);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 20px 12px;
        color: var(--text-primary);
        background:
          radial-gradient(circle at 15% 5%, rgba(255, 255, 255, 0.95), transparent 28%),
          var(--page-background);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      summary,
      label,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .feedback-card {
        width: min(100%, 860px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--card-background);
        box-shadow: var(--shadow);
      }

      .card-content {
        padding: 32px 36px 28px;
      }

      .card-header {
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr);
        align-items: start;
        gap: 22px;
      }

      .card-icon {
        display: block;
        width: 62px;
        height: 62px;
        border-radius: 14px;
        object-fit: cover;
      }

      .card-title {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: clamp(28px, 3.4vw, 38px);
        font-weight: 500;
        line-height: 1.18;
        letter-spacing: -0.02em;
      }

      .period {
        margin: 7px 0 0;
        color: #8c939c;
        font-size: 20px;
        line-height: 1.4;
      }

      .report-link {
        display: inline-flex;
        min-height: 48px;
        margin-top: 16px;
        align-items: center;
        gap: 12px;
        color: var(--brand);
        font-size: 23px;
        text-decoration: none;
      }

      .report-link__icon {
        color: #a8adb4;
        font-size: 31px;
      }

      .weekly-summary {
        margin: 34px 0 0;
        padding: 0 0 28px 28px;
        border-bottom: 1px solid var(--border);
      }

      .weekly-summary li {
        margin-top: 10px;
        padding-left: 7px;
        font-size: 20px;
        line-height: 1.55;
      }

      .weekly-summary li:first-child {
        margin-top: 0;
      }

      .feedback-form {
        display: grid;
        gap: 24px;
        padding-top: 28px;
      }

      .form-section {
        display: grid;
        gap: 12px;
      }

      .form-label,
      .form-section legend {
        margin: 0;
        padding: 0;
        color: var(--text-secondary);
        font-size: 15px;
        font-weight: 500;
      }

      .required-mark {
        margin-left: 3px;
        color: var(--danger);
      }

      .readonly-value {
        min-height: 46px;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: #f8f9fa;
        font-size: 17px;
        line-height: 1.4;
      }

      .project-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .project-tag {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        padding: 6px 11px;
        border-radius: 10px;
        color: #3c4653;
        background: #f1f3f5;
        font-size: 15px;
      }

      fieldset {
        min-width: 0;
        margin: 0;
        border: 0;
      }

      .choice-options {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .choice-options.is-invalid {
        padding: 8px;
        border-radius: 14px;
        background: rgba(231, 68, 68, 0.08);
      }

      .choice-option {
        display: inline-flex;
        min-width: 128px;
        min-height: 48px;
        cursor: pointer;
        align-items: center;
        gap: 9px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: #ffffff;
        font-size: 17px;
      }

      .choice-option:has(input:checked) {
        border-color: var(--brand);
        background: var(--brand-soft);
      }

      .choice-option input,
      .reason-option input {
        width: 20px;
        height: 20px;
        margin: 0;
        cursor: pointer;
        accent-color: var(--brand);
      }

      .reason-picker {
        border: 1px solid var(--border);
        border-radius: 13px;
        background: #ffffff;
      }

      .reason-picker[hidden] {
        display: none;
      }

      .reason-picker > summary {
        display: flex;
        min-height: 48px;
        cursor: pointer;
        list-style: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 14px;
        color: var(--text-secondary);
        font-size: 15px;
      }

      .reason-picker > summary::-webkit-details-marker {
        display: none;
      }

      .reason-picker > summary::after {
        content: "⌄";
        color: #8e959e;
        transition: transform 160ms ease;
      }

      .reason-picker[open] > summary::after {
        transform: rotate(180deg);
      }

      .reason-options {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 0 12px 12px;
      }

      .reason-option {
        display: flex;
        min-height: 42px;
        cursor: pointer;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 10px;
        background: #f7f8fa;
        font-size: 15px;
      }

      .feedback-input {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 13px;
        color: var(--text-primary);
        background: #ffffff;
        font-size: 16px;
        line-height: 1.55;
      }

      .feedback-input::placeholder {
        color: var(--text-placeholder);
      }

      .submit-area {
        padding: 2px 72px 0;
      }

      .submit-button {
        width: 100%;
        min-height: 50px;
        cursor: pointer;
        border: 0;
        border-radius: 25px;
        color: var(--brand);
        background: #f0f2f5;
        font-size: 18px;
        font-weight: 600;
      }

      .submit-button:disabled {
        cursor: not-allowed;
        color: #9299a2;
      }

      .submit-message {
        min-height: 22px;
        margin: 8px 4px 0;
        color: var(--text-secondary);
        font-size: 14px;
        text-align: center;
      }

      .submit-message.is-error {
        color: var(--danger);
      }

      .feedback-card.is-submitted input,
      .feedback-card.is-submitted textarea,
      .feedback-card.is-submitted summary {
        cursor: not-allowed;
        opacity: 0.68;
      }

      .data-error {
        padding: 28px 24px;
      }

      .data-error__title {
        margin: 0;
        color: var(--danger);
        font-size: 22px;
      }

      .data-error__message {
        margin: 12px 0 0;
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.6;
      }

      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid rgba(11, 124, 255, 0.24);
        outline-offset: 2px;
      }

      @media (hover: hover) and (pointer: fine) {
        .report-link:hover {
          text-decoration: underline;
          text-underline-offset: 4px;
        }

        .choice-option:hover,
        .reason-picker:hover,
        .feedback-input:hover {
          border-color: #cbd1d8;
        }

        .submit-button:hover:not(:disabled) {
          color: #ffffff;
          background: var(--brand);
        }
      }

      @media (max-width: 620px) {
        body {
          padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        }

        .feedback-card {
          border-radius: 18px;
        }

        .card-content {
          padding: 20px 16px 16px;
        }

        .card-header {
          grid-template-columns: 46px minmax(0, 1fr);
          gap: 12px;
        }

        .card-icon {
          width: 46px;
          height: 46px;
          border-radius: 10px;
        }

        .card-title {
          font-size: clamp(21px, 6.4vw, 27px);
        }

        .period {
          margin-top: 4px;
          font-size: 15px;
        }

        .report-link {
          min-height: 44px;
          margin-top: 10px;
          font-size: 19px;
        }

        .report-link__icon {
          font-size: 27px;
        }

        .weekly-summary {
          margin-top: 20px;
          padding-bottom: 20px;
          padding-left: 23px;
        }

        .weekly-summary li {
          margin-top: 8px;
          font-size: 16px;
        }

        .feedback-form {
          gap: 20px;
          padding-top: 20px;
        }

        .readonly-value,
        .choice-option {
          font-size: 16px;
        }

        .choice-options {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .choice-option {
          min-width: 0;
          min-height: 46px;
        }

        .reason-options {
          grid-template-columns: 1fr;
        }

        .feedback-input {
          min-height: 84px;
          resize: none;
        }

        .submit-area {
          padding: 0 18px;
        }

        .submit-button {
          min-height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <article class="feedback-card" id="feedbackCard" aria-labelledby="cardTitle">
      <div class="card-content">
        <header class="card-header">
          <img class="card-icon" id="cardIcon" alt="" />
          <div>
            <h1 class="card-title" id="cardTitle"></h1>
            <p class="period" id="reportPeriod"></p>
          </div>
        </header>

        <a class="report-link" id="reportLink" target="_blank" rel="noopener noreferrer">
          <span class="report-link__icon" aria-hidden="true">▤</span>
          <span id="reportLinkText"></span>
        </a>

        <ul class="weekly-summary" id="weeklySummary"></ul>

        <form class="feedback-form" id="feedbackForm" novalidate>
          <section class="form-section">
            <p class="form-label">客户</p>
            <div class="readonly-value" id="customerName"></div>
          </section>

          <section class="form-section">
            <p class="form-label">进行中的项目</p>
            <div class="project-tags" id="projectNames"></div>
          </section>

          <fieldset class="form-section">
            <legend>是否满意<span class="required-mark" aria-hidden="true">*</span></legend>
            <div class="choice-options" id="satisfactionOptions"></div>
          </fieldset>

          <details class="reason-picker" id="dissatisfactionReasons" hidden>
            <summary id="reasonSummary"></summary>
            <div class="reason-options" id="reasonOptions"></div>
          </details>

          <section class="form-section">
            <label class="form-label" for="feedbackInput">具体反馈</label>
            <textarea
              class="feedback-input"
              id="feedbackInput"
              maxlength="1000"
              placeholder="请输入具体反馈（可选）"
            ></textarea>
          </section>

          <div class="submit-area">
            <button class="submit-button" id="submitButton" type="submit"></button>
            <p class="submit-message" id="submitMessage" role="status" aria-live="polite"></p>
          </div>
        </form>
      </div>
    </article>

    <!--
      WeeklyFeedbackFormData v2：生成时只替换本标签内的严格 JSON。
      projects 只描述只读项目；满意度、原因和反馈是整张表单的单值。
    -->
    <script type="application/json" id="weeklyFeedbackFormData">
      {
        "schemaVersion": 2,

        "summaryMarkdown": [
          "本周新增需求 **11** 项，其中 **2** 项已完成",

        ],
        "projects": [
          { "id": "p1", "name": "智能助理项目" },
          { "id": "p2", "name": "数据看板项目" }
        ],
        "satisfaction": "",
        "dissatisfactionReasons": [],
        "feedback": "",
        "dissatisfactionOptions": [
          "响应不及时",
          "问题未解决",
          "交付质量不佳",
          "沟通体验不佳",
          "需求理解偏差",
          "其他"
        ],
        "reportPeriod": "2026年3月31日—2026年4月10日",
        "customer": "维信诺",
        "week": "2026-W15",
        "collector": "辰驷",
        "reportTime": "2026-08-30 07:00:00",
        "submissionId": "WEB-FORM-2026-W15",

        "callbackHeaders": {},
        "formDisabled": false
      }
    </script>

    <script src="./multica-fetch-proxy-config.js"></script>
    <script src="./dingtalk-identity.js"></script>
    <script src="./weekly-feedback-runtime.js"></script>
  </body>
</html>
