<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>客户周报满意度回访</title>
    <style>
      :root {
        color-scheme: light;
        --visual-viewport-height: 100dvh;
        --page-background: #f3f4f6;
        --card-background: rgba(255, 255, 255, 0.96);
        --text-primary: #171a1d;
        --text-secondary: #747b84;
        --text-placeholder: #b7bdc5;
        --brand: #0b7cff;
        --brand-hover: #006ee6;
        --border: #e3e6ea;
        --divider: #e6e8eb;
        --control-background: #ffffff;
        --button-background: #f2f3f5;
        --danger: #e74444;
        --shadow: 0 12px 40px rgba(31, 35, 41, 0.08);
        --radius-card: 22px;
        --radius-control: 18px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page-background);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 20px 12px;
        color: var(--text-primary);
        background:
          radial-gradient(circle at 15% 5%, rgba(255, 255, 255, 0.95), transparent 28%),
          var(--page-background);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: manipulation;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button,
      summary,
      label,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .feedback-card {
        width: min(100%, 1080px);
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        background: var(--card-background);
        box-shadow: var(--shadow);
      }

      .card-content {
        padding: 32px 36px 28px;
      }

      .card-header {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        align-items: start;
        gap: 24px;
      }

      .card-icon {
        display: block;
        width: 62px;
        height: 62px;
        border-radius: 14px;
        object-fit: cover;
      }

      .card-heading {
        min-width: 0;
      }

      .card-title {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: clamp(28px, 3.4vw, 38px);
        font-weight: 400;
        line-height: 1.18;
        letter-spacing: -0.02em;
      }

      .period {
        margin: 6px 0 0;
        color: #8d939b;
        font-size: 22px;
        line-height: 1.35;
      }

      .report-link {
        display: grid;
        grid-template-columns: 64px max-content;
        align-items: center;
        gap: 24px;
        margin-top: 12px;
        color: var(--brand);
        font-size: 29px;
        font-weight: 400;
        line-height: 1.35;
        text-decoration: none;
      }

      .report-link:focus-visible,
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 3px solid rgba(11, 124, 255, 0.24);
        outline-offset: 2px;
      }

      .report-link__icon {
        display: grid;
        width: 62px;
        height: 54px;
        place-items: center;
        color: #a9adb3;
        font-size: 43px;
      }

      .weekly-summary {
        margin: 60px 0 0;
        padding: 0 0 34px;
        border-bottom: 1px solid var(--divider);
        list-style: none;
      }

      .weekly-summary li {
        position: relative;
        margin-top: 20px;
        padding-left: 58px;
        font-size: 27px;
        line-height: 1.48;
      }

      .weekly-summary li:first-child {
        margin-top: 0;
      }

      .weekly-summary li::before {
        position: absolute;
        top: 0;
        left: 8px;
        content: "•";
        font-weight: 700;
      }

      .project-list {
        display: grid;
      }

      .project-row {
        padding: 18px 0 20px;
        border-bottom: 1px solid var(--divider);
      }

      .project-row:first-child {
        padding-top: 20px;
      }

      .project-row:last-child {
        padding-bottom: 10px;
        border-bottom: 0;
      }

      .project-main {
        --reason-inline-offset: 124px;
        display: grid;
        grid-template-areas:
          "name satisfaction ."
          "name satisfaction reason";
        grid-template-columns: minmax(150px, 1fr) minmax(130px, 0.62fr) minmax(250px, 1.85fr);
        grid-template-rows: repeat(2, minmax(40px, auto));
        align-items: start;
        column-gap: 16px;
      }

      .project-name {
        grid-area: name;
        margin: 4px 0 0;
        overflow-wrap: anywhere;
        font-size: 25px;
        font-weight: 400;
        line-height: 1.45;
      }

      .satisfaction-options {
        grid-area: satisfaction;
        display: grid;
        grid-template-rows: repeat(2, minmax(40px, auto));
      }

      .satisfaction-option {
        display: inline-flex;
        width: max-content;
        max-width: 100%;
        cursor: pointer;
        align-items: center;
        gap: 9px;
        font-size: 25px;
        line-height: 1.35;
      }

      .satisfaction-option input,
      .reason-option input {
        width: 24px;
        height: 24px;
        margin: 0;
        cursor: pointer;
        accent-color: var(--brand);
      }

      .satisfaction-option input {
        appearance: none;
        border: 2px solid #d7dbe0;
        border-radius: 7px;
        background: #ffffff;
      }

      .satisfaction-option input:checked {
        border: 7px solid var(--brand);
        background: #ffffff;
      }

      .project-row.is-invalid .satisfaction-options {
        padding: 6px;
        border-radius: 12px;
        background: rgba(231, 68, 68, 0.07);
      }

      .feedback-trigger {
        display: flex;
        width: 100%;
        min-height: 44px;
        margin-top: 8px;
        cursor: pointer;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-control);
        color: var(--text-placeholder);
        background: var(--control-background);
        font-size: 16px;
        text-align: left;
      }

      .feedback-trigger.has-value {
        color: var(--text-primary);
      }

      .feedback-trigger__text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .feedback-trigger__icon {
        flex: 0 0 auto;
        color: #9aa0a7;
        font-size: 18px;
      }

      .reason-picker {
        grid-area: reason;
        grid-row: 2;
        grid-column: 2 / 4;
        position: relative;
        align-self: center;
        justify-self: stretch;
        min-width: 0;
        margin: 0;
      }

      .reason-picker > summary {
        display: inline-flex;
        width: max-content;
        max-width: calc(100% - var(--reason-inline-offset));
        min-height: 40px;
        margin-left: var(--reason-inline-offset);
        cursor: pointer;
        list-style: none;
        align-items: center;
        justify-content: flex-start;
        gap: 6px;
        padding: 0 4px;
        border: 0;
        border-radius: 8px;
        color: #9aa0a7;
        background: transparent;
        font-size: 14px;
      }

      .reason-picker > summary::-webkit-details-marker {
        display: none;
      }

      .reason-picker[open] > summary {
        color: #7e858d;
      }

      .reason-picker.has-value > summary {
        color: #9aa0a7;
      }

      .reason-picker__chevron {
        color: #9aa0a7;
        transition: transform 160ms ease;
      }

      .reason-summary-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .reason-summary-text:empty {
        display: none;
      }

      .reason-picker[open] > summary .reason-picker__chevron {
        transform: rotate(180deg);
      }

      .reason-options {
        position: absolute;
        z-index: 10;
        top: calc(100% + 8px);
        right: auto;
        left: 0;
        display: grid;
        width: min(360px, 100%);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #ffffff;
        box-shadow: 0 14px 32px rgba(31, 35, 41, 0.14);
      }

      .reason-option {
        display: flex;
        min-height: 42px;
        cursor: pointer;
        align-items: center;
        gap: 9px;
        padding: 6px 9px;
        border-radius: 10px;
        font-size: 15px;
      }

      .reason-option input {
        width: 19px;
        height: 19px;
      }

      .submit-area {
        margin-top: 16px;
        padding: 0 72px;
      }

      .submit-button {
        width: 100%;
        min-height: 56px;
        cursor: pointer;
        border: 0;
        border-radius: 28px;
        color: var(--brand);
        background: var(--button-background);
        font-size: 20px;
        font-weight: 500;
        transition:
          color 160ms ease,
          background 160ms ease,
          transform 160ms ease;
      }

      .submit-button:disabled {
        cursor: not-allowed;
        color: #969ca4;
      }

      .submit-message {
        min-height: 22px;
        margin: 8px 6px 0;
        color: var(--text-secondary);
        font-size: 14px;
        text-align: center;
      }

      .submit-message.is-error {
        color: var(--danger);
      }

      .feedback-card.is-submitted .feedback-trigger,
      .feedback-card.is-submitted .reason-picker > summary,
      .feedback-card.is-submitted .satisfaction-option {
        cursor: not-allowed;
        opacity: 0.64;
      }

      .feedback-dialog {
        width: min(calc(100% - 32px), 560px);
        padding: 0;
        border: 0;
        border-radius: 20px;
        color: var(--text-primary);
        background: #ffffff;
        box-shadow: 0 24px 70px rgba(31, 35, 41, 0.24);
      }

      .feedback-dialog::backdrop {
        background: rgba(18, 21, 26, 0.42);
        backdrop-filter: blur(3px);
      }

      .data-error {
        padding: 28px 24px;
      }

      .data-error__title {
        margin: 0;
        color: var(--danger);
        font-size: 22px;
      }

      .data-error__message {
        margin: 12px 0 0;
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.6;
      }

      .dialog-form {
        padding: 24px;
      }

      .dialog-title {
        margin: 0;
        font-size: 23px;
        font-weight: 600;
      }

      .dialog-subtitle {
        margin: 8px 0 16px;
        color: var(--text-secondary);
        font-size: 15px;
      }

      .feedback-input {
        display: block;
        width: 100%;
        min-height: 112px;
        resize: vertical;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        color: var(--text-primary);
        background: #ffffff;
        font-size: 16px;
        line-height: 1.5;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      .dialog-button {
        min-width: 92px;
        min-height: 42px;
        cursor: pointer;
        border: 0;
        border-radius: 12px;
        font-weight: 600;
      }

      .dialog-button--secondary {
        color: var(--text-primary);
        background: #f0f2f5;
      }

      .dialog-button--primary {
        color: #ffffff;
        background: var(--brand);
      }

      @media (hover: hover) and (pointer: fine) {
        .report-link:hover {
          color: var(--brand-hover);
          text-decoration: underline;
          text-underline-offset: 4px;
        }

        .feedback-trigger:hover,
        .reason-picker > summary:hover {
          border-color: #cfd4da;
          color: var(--text-secondary);
        }

        .reason-option:hover {
          background: #f5f7fa;
        }

        .submit-button:hover:not(:disabled) {
          color: #ffffff;
          background: var(--brand);
          transform: translateY(-1px);
        }
      }

      @media (max-width: 720px) {
        .card-content {
          padding: 28px 30px 24px;
        }

        .card-header {
          grid-template-columns: 54px minmax(0, 1fr);
          gap: 18px;
        }

        .card-icon {
          width: 52px;
          height: 52px;
          border-radius: 12px;
        }

        .card-title {
          font-size: clamp(26px, 4.2vw, 34px);
        }

        .period {
          font-size: 18px;
        }

        .report-link {
          grid-template-columns: 54px max-content;
          gap: 18px;
          font-size: 25px;
        }

        .report-link__icon {
          width: 52px;
          font-size: 37px;
        }

        .weekly-summary {
          margin-top: 36px;
          padding-bottom: 24px;
        }

        .weekly-summary li {
          margin-top: 14px;
          padding-left: 42px;
          font-size: 22px;
        }

        .project-main {
          --reason-inline-offset: 108px;
          grid-template-areas:
            "name satisfaction ."
            "name satisfaction reason";
          grid-template-columns: minmax(120px, 1fr) minmax(110px, 0.7fr) minmax(180px, 1.7fr);
          grid-template-rows: repeat(2, minmax(44px, auto));
          column-gap: 12px;
          row-gap: 0;
        }

        .satisfaction-options {
          grid-template-rows: repeat(2, minmax(44px, auto));
        }

        .project-name,
        .satisfaction-option {
          font-size: 22px;
        }

        .reason-picker {
          margin-top: 0;
        }
      }

      @media (max-width: 620px) {
        body {
          padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        }

        .feedback-card {
          border-radius: 18px;
        }

        .card-content {
          padding: 18px 16px 14px;
        }

        .card-header {
          grid-template-columns: 46px minmax(0, 1fr);
          gap: 12px;
        }

        .card-icon {
          width: 44px;
          height: 44px;
          border-radius: 10px;
        }

        .card-title {
          font-size: clamp(21px, 6.6vw, 27px);
        }

        .period {
          margin-top: 3px;
          font-size: 15px;
        }

        .report-link {
          grid-template-columns: 44px max-content;
          gap: 12px;
          margin-top: 12px;
          min-height: 44px;
          font-size: 20px;
        }

        .report-link__icon {
          width: 44px;
          height: 40px;
          font-size: 30px;
        }

        .weekly-summary {
          margin: 26px 0 0;
          padding-bottom: 20px;
        }

        .weekly-summary li {
          margin-top: 9px;
          padding-left: 28px;
          font-size: 17px;
        }

        .project-row {
          padding: 12px 0 14px;
        }

        .project-row:first-child {
          padding-top: 14px;
        }

        .project-row:last-child {
          padding-bottom: 8px;
        }

        .project-main {
          --reason-inline-offset: 80px;
          grid-template-areas:
            "name satisfaction ."
            "name satisfaction reason";
          grid-template-columns: minmax(78px, 1fr) minmax(82px, 0.82fr) minmax(110px, 1.5fr);
          grid-template-rows: repeat(2, minmax(44px, auto));
          column-gap: 6px;
          row-gap: 0;
        }

        .project-name,
        .satisfaction-option {
          font-size: 16px;
        }

        .satisfaction-option {
          gap: 6px;
          min-height: 44px;
        }

        .satisfaction-options {
          grid-template-rows: repeat(2, minmax(44px, auto));
        }

        .satisfaction-option input {
          width: 22px;
          height: 22px;
        }

        .feedback-trigger {
          min-height: 44px;
          margin-top: 8px;
          padding: 0 12px;
          border-radius: 15px;
          font-size: 16px;
        }

        .feedback-trigger__icon {
          font-size: 18px;
        }

        .reason-picker > summary {
          min-height: 44px;
          gap: 4px;
          padding: 0;
          border-radius: 8px;
          font-size: 12px;
        }

        .reason-picker__chevron {
          font-size: 11px;
        }

        .reason-options {
          position: absolute;
          right: auto;
          left: 0;
          width: min(280px, 100%);
          grid-template-columns: 1fr;
          margin-top: 8px;
          padding: 8px;
          border-radius: 14px;
          background: #ffffff;
          box-shadow: 0 12px 28px rgba(31, 35, 41, 0.16);
        }

        .reason-option {
          min-height: 44px;
          padding: 8px 10px;
        }

        .submit-button {
          min-height: 48px;
          font-size: 18px;
        }

        .submit-area {
          margin-top: 14px;
          padding: 0 18px;
        }

        .feedback-dialog {
          inset: auto 8px max(8px, env(safe-area-inset-bottom)) 8px;
          width: auto;
          max-width: none;
          max-height: calc(var(--visual-viewport-height) - 16px);
          margin: 0;
          border-radius: 22px 22px 14px 14px;
        }

        .dialog-form {
          max-height: calc(var(--visual-viewport-height) - 16px);
          overflow: auto;
          padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
          overscroll-behavior: contain;
        }

        .dialog-title {
          font-size: 21px;
        }

        .feedback-input {
          min-height: 120px;
          max-height: min(24dvh, 180px);
          resize: none;
          font-size: 16px;
        }

        .dialog-actions {
          position: sticky;
          bottom: 0;
          padding-top: 12px;
          background: #ffffff;
        }

        .dialog-button {
          flex: 1 1 0;
          min-height: 48px;
        }
      }

      @media (max-width: 380px) {
        .card-content {
          padding-right: 14px;
          padding-left: 14px;
        }

        .project-main {
          grid-template-columns: minmax(70px, 1fr) minmax(78px, 0.82fr) minmax(104px, 1.45fr);
          grid-template-areas:
            "name satisfaction ."
            "name satisfaction reason";
          column-gap: 6px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <article class="feedback-card" id="feedbackCard" aria-labelledby="cardTitle">
      <div class="card-content">
        <header class="card-header">
          <img class="card-icon" id="cardIcon" alt="" />
          <div class="card-heading">
            <h1 class="card-title" id="cardTitle"></h1>
            <p class="period" id="reportPeriod"></p>
          </div>
        </header>

        <a class="report-link" id="reportLink" target="_blank" rel="noopener noreferrer">
          <span class="report-link__icon" aria-hidden="true">
            <span aria-hidden="true">▤</span>
          </span>
          <span id="reportLinkText"></span>
        </a>

        <ul class="weekly-summary" id="weeklySummary"></ul>

        <section class="project-list" id="projectList" aria-label="项目反馈"></section>

        <div class="submit-area">
          <button class="submit-button" id="submitButton" type="button"></button>
          <p class="submit-message" id="submitMessage" role="status" aria-live="polite"></p>
        </div>
      </div>
    </article>

    <dialog class="feedback-dialog" id="feedbackDialog">
      <form class="dialog-form" method="dialog" id="dialogForm">
        <h2 class="dialog-title">填写具体反馈</h2>
        <p class="dialog-subtitle" id="dialogProjectName"></p>
        <textarea
          class="feedback-input"
          id="feedbackInput"
          maxlength="1000"
          placeholder="请输入具体反馈（可选）"
        ></textarea>
        <div class="dialog-actions">
          <button class="dialog-button dialog-button--secondary" value="cancel" type="submit">取消</button>
          <button class="dialog-button dialog-button--primary" id="saveFeedback" value="default" type="submit">
            保存
          </button>
        </div>
      </form>
    </dialog>

    <!--
      唯一需要替换的数据区：生成时只替换 weeklyReportCardData 标签内的 JSON 文本。
      必须使用严格 JSON；字符串中如出现 </script>，序列化时需写成 <\/script>。

      WeeklyReportCardData 接口：
      {
        schemaVersion: 1,
        iconUrl: string, title: string, reportUrl: string,
        reportLinkText?: string, summaryMarkdown: string[],
        projects: Array<{
          id: string, name: string,
          satisfaction?: "" | "满意" | "不满意",
          reasons?: string[], feedback?: string,
          reasonOptions?: Array<{ value: string, text?: { zh_CN?: string } }>
        }>,
        dissatisfactionOptions: string[],
        reportPeriod: string, customer: string, week: string,
        collector: string, reportTime: string, submissionId: string,
        callbackUrl?: string, callbackHeaders?: Record<string, string>,
        formDisabled?: boolean
      }
    -->
    <script type="application/json" id="weeklyReportCardData">
      {
        "schemaVersion": 1,
        "iconUrl": "https://img.alicdn.com/imgextra/i4/O1CN01IPbS5e1f6ok5Oa1EH_!!6000000003958-2-tps-96-96.png",
        "title": "维信诺项目周报回访",
        "reportUrl": "https://alidocs.dingtalk.com/i/nodes/example",
        "reportLinkText": "查看完整周报",
        "summaryMarkdown": [
          "本周新增需求 **11** 项，其中 **2** 项已完成",
          "当前 **6** 个工单处理中，**2** 个已关闭",
          "重点跟进文档/表格操作体验及多人协同问题"
        ],
        "projects": [
          {
            "id": "p1",
            "name": "智能助理项目",
            "satisfaction": "",
            "reasons": [],
            "feedback": ""
          },
          {
            "id": "p2",
            "name": "数据看板项目",
            "satisfaction": "",
            "reasons": [],
            "feedback": ""
          }
        ],
        "dissatisfactionOptions": [
          "响应不及时",
          "问题未解决",
          "交付质量不佳",
          "沟通体验不佳",
          "需求理解偏差",
          "其他"
        ],
        "reportPeriod": "2026年3月31日—2026年4月10日",
        "customer": "维信诺",
        "week": "2026-W15",
        "collector": "辰驷",
        "reportTime": "2026-08-27 10:00:00",
        "submissionId": "CARD-MOCK-2026-W15",
        "callbackUrl": "",
        "callbackHeaders": {},
        "formDisabled": false
      }
    </script>

    <script src="./multica-fetch-proxy-config.js"></script>
    <script src="./dingtalk-identity.js"></script>
